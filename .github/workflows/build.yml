name: Build GoldenCC

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build GoldenCC
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # INSTALL DEPENDENCIES
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          set -e

          echo "================================"
          echo "Preparing Ubuntu repositories"
          echo "================================"

          # Troca o mirror Azure por archive.ubuntu.com
          # para evitar travamentos no apt do GitHub Runner.
          sudo sed -i \
            's|azure.archive.ubuntu.com/ubuntu|archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list.d/ubuntu.sources

          echo ""
          echo "APT sources:"
          cat /etc/apt/sources.list.d/ubuntu.sources || true

          echo ""
          echo "================================"
          echo "Updating APT"
          echo "================================"

          sudo apt-get \
            -o Acquire::ForceIPv4=true \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update

          echo ""
          echo "================================"
          echo "Installing dependencies"
          echo "================================"

          sudo apt-get install -y \
            bash \
            curl \
            git \
            make \
            perl \
            fakeroot \
            xz-utils \
            zip \
            unzip \
            rsync \
            libtinfo6

          echo ""
          echo "Dependencies installed successfully."

      # --------------------------------------------------
      # INSTALL THEOS
      # --------------------------------------------------
      - name: Install Theos
        env:
          THEOS: /home/runner/theos
          CI: "1"
        run: |
          set -e

          echo "================================"
          echo "Installing Theos"
          echo "================================"

          echo "THEOS=$THEOS"

          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      # --------------------------------------------------
      # VERIFY THEOS
      # --------------------------------------------------
      - name: Verify Theos
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "================================"
          echo "Theos verification"
          echo "================================"

          echo "THEOS=$THEOS"

          test -d "$THEOS"
          test -f "$THEOS/makefiles/common.mk"
          test -f "$THEOS/makefiles/aggregate.mk"

          echo ""
          echo "Checking iOS toolchain..."

          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang++"

          echo ""
          echo "clang:"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version

          echo ""
          echo "clang++:"
          "$THEOS/toolchain/linux/iphone/bin/clang++" --version

          echo ""
          echo "SDKs:"
          ls -lah "$THEOS/sdks"

          echo ""
          echo "================================"
          echo "Theos + toolchain OK"
          echo "================================"

      # --------------------------------------------------
      # BUILD GOLDENCC
      # --------------------------------------------------
      - name: Build GoldenCC
        run: |
          set -e

          export THEOS="$HOME/theos"

          echo "================================"
          echo "Building GoldenCC"
          echo "================================"

          echo "THEOS=$THEOS"

          echo ""
          echo "Cleaning previous build..."
          make clean

          echo ""
          echo "Compiling..."
          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless

          echo ""
          echo "================================"
          echo "Build completed successfully"
          echo "================================"

      # --------------------------------------------------
      # SHOW PACKAGES
      # --------------------------------------------------
      - name: Show packages
        if: success()
        run: |
          echo "================================"
          echo "Generated packages"
          echo "================================"

          ls -lah packages/

      # --------------------------------------------------
      # UPLOAD DEB
      # --------------------------------------------------
      - name: Upload GoldenCC .deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GoldenCC
          path: packages/*.deb
          if-no-files-found: error
