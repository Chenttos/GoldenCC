name: Build GoldenCC

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build GoldenCC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash \
            curl \
            git \
            make \
            perl \
            zip \
            rsync \
            fakeroot \
            libxml2 \
            xz-utils \
            bzip2

      - name: Install Theos
        run: |
          export THEOS="$HOME/theos"

          git clone --recursive \
            https://github.com/theos/theos.git \
            "$THEOS"

      - name: Install iOS Toolchain
        run: |
          export THEOS="$HOME/theos"

          mkdir -p "$THEOS/toolchain/linux"

          curl -L \
            https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            -o /tmp/iOSToolchain.tar.xz

          file /tmp/iOSToolchain.tar.xz

          tar -xJf /tmp/iOSToolchain.tar.xz \
            -C "$THEOS/toolchain/linux"

          echo "Toolchain installed."

          find "$THEOS/toolchain/linux" \
            -maxdepth 4 \
            -type f \
            -name clang \
            -o -name clang++

      - name: Install iOS SDK
        run: |
          export THEOS="$HOME/theos"

          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            /tmp/sdks

          mkdir -p "$THEOS/sdks"

          if [ -d "/tmp/sdks/iPhoneOS16.5.sdk" ]; then
            cp -R /tmp/sdks/iPhoneOS16.5.sdk \
              "$THEOS/sdks/"
          else
            echo "iPhoneOS16.5.sdk not found."
            echo "Available SDKs:"
            find /tmp/sdks -maxdepth 1 -type d -name "iPhoneOS*.sdk"
            exit 1
          fi

          echo "Installed SDKs:"
          ls -lah "$THEOS/sdks"

      - name: Verify Theos
        run: |
          export THEOS="$HOME/theos"

          echo "THEOS=$THEOS"

          test -f "$THEOS/makefiles/common.mk"
          test -f "$THEOS/makefiles/aggregate.mk"

          echo "Theos installation OK."

          echo "Toolchain:"
          find "$THEOS/toolchain/linux" \
            -type f \
            \( -name clang -o -name clang++ \) \
            -print

          echo "SDKs:"
          ls -lah "$THEOS/sdks"

      - name: Build GoldenCC
        run: |
          export THEOS="$HOME/theos"

          echo "================================"
          echo "Building GoldenCC"
          echo "================================"

          echo "THEOS=$THEOS"

          make clean

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless

      - name: Show packages
        if: success()
        run: |
          echo "================================"
          echo "Generated packages"
          echo "================================"

          ls -lah packages/

      - name: Upload GoldenCC .deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GoldenCC
          path: packages/*.deb
          if-no-files-found: error
