name: Build GoldenCC

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build GoldenCC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bash \
            curl \
            git \
            make \
            perl \
            fakeroot \
            xz-utils \
            zip \
            unzip \
            rsync \
            libtinfo6

      - name: Install Theos
        env:
          THEOS: /home/runner/theos
          CI: "1"
        run: |
          echo "Installing Theos..."

          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Verify Theos
        run: |
          export THEOS="$HOME/theos"

          echo "================================"
          echo "Theos verification"
          echo "================================"

          echo "THEOS=$THEOS"

          test -d "$THEOS"
          test -f "$THEOS/makefiles/common.mk"
          test -f "$THEOS/makefiles/aggregate.mk"

          echo ""
          echo "Checking iOS toolchain..."

          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang++"

          echo "clang:"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version

          echo ""
          echo "clang++:"
          "$THEOS/toolchain/linux/iphone/bin/clang++" --version

          echo ""
          echo "SDKs:"
          ls -lah "$THEOS/sdks"

          echo ""
          echo "================================"
          echo "Theos + toolchain OK"
          echo "================================"

      - name: Build GoldenCC
        run: |
          export THEOS="$HOME/theos"

          echo "================================"
          echo "Building GoldenCC"
          echo "================================"

          echo "THEOS=$THEOS"

          make clean

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless

      - name: Show packages
        if: success()
        run: |
          echo "================================"
          echo "Generated packages"
          echo "================================"

          ls -lah packages/

      - name: Upload GoldenCC .deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GoldenCC
          path: packages/*.deb
          if-no-files-found: error
