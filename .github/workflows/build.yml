name: Build GoldenCC

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build GoldenCC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            make \
            git \
            curl \
            perl \
            xz-utils \
            bzip2 \
            unzip

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"

      - name: Install iOS Toolchain
        run: |
          mkdir -p "$HOME/theos/toolchain/linux/iphone"

          curl -L \
            "https://github.com/theos/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma" \
            -o /tmp/toolchain.tar.lzma

          tar --lzma -xf /tmp/toolchain.tar.lzma \
            -C "$HOME/theos/toolchain/linux/iphone"

      - name: Install iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks

          mkdir -p "$HOME/theos/sdks"

          cp -R /tmp/sdks/iPhoneOS16.5.sdk \
            "$HOME/theos/sdks/"

      - name: Verify Theos toolchain
        run: |
          export THEOS="$HOME/theos"

          echo "THEOS=$THEOS"

          test -f "$THEOS/makefiles/common.mk"
          test -f "$THEOS/makefiles/aggregate.mk"

          echo "Checking iOS compiler..."

          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang++"

          "$THEOS/toolchain/linux/iphone/bin/clang" --version
          "$THEOS/toolchain/linux/iphone/bin/clang++" --version

          echo "Theos toolchain OK"

      - name: Build GoldenCC
        run: |
          export THEOS="$HOME/theos"

          echo "Building GoldenCC..."

          make clean

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless

      - name: Show packages
        if: success()
        run: |
          echo "Generated packages:"
          ls -lah packages/

      - name: Upload GoldenCC .deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GoldenCC
          path: packages/*.deb
          if-no-files-found: error
